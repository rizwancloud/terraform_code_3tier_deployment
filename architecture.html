<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWS Multi-Tier Architecture (Animated)</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#555;--box:#fff;--line:#333;--sub:#999;--sg:#f9a8b8;--req:#2563eb;--res:#16a34a;--nat:#a21caf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#eee;--mut:#aaa;--box:#1e2127;--line:#bbb;--sub:#666;--sg:#7a2a3d;--req:#60a5fa;--res:#4ade80;--nat:#e879f9}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#eee;--mut:#aaa;--box:#1e2127;--line:#bbb;--sub:#666;--sg:#7a2a3d;--req:#60a5fa;--res:#4ade80;--nat:#e879f9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
h1{font-size:16px;margin:12px 8px 4px;text-align:center}
button{margin:4px;padding:6px 14px;border:1px solid var(--line);background:var(--box);color:var(--fg);border-radius:8px;cursor:pointer}
svg{width:100%;max-width:760px;height:auto}
text{fill:var(--fg);font-size:12px}
.m{fill:var(--mut);font-size:10px}
.b{fill:var(--box);stroke:var(--line);stroke-width:1.3}
.z{fill:none;stroke:var(--sub);stroke-dasharray:5 4}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:d 1s linear infinite}
.q{stroke:var(--req)}.n{stroke:var(--nat)}
@keyframes d{to{stroke-dashoffset:-12}}
.sg{fill:var(--sg);stroke:none}
</style></head><body>
<h1>3-Tier AWS Architecture: live request flow</h1>
<div><button id="t">Pause</button></div>
<svg id="s" viewBox="0 0 800 1040" xmlns="http://www.w3.org/2000/svg">
<defs>
<path id="A" d="M400,64 L400,262 L220,262 L220,750"/>
<path id="B" d="M400,64 L400,262 L590,262 L590,708 L300,708 L300,750"/>
<path id="RA" d="M220,750 L220,262 L400,262 L400,64"/>
<path id="RB" d="M300,750 L300,708 L590,708 L590,262 L400,262 L400,64"/>
<path id="N1" d="M100,570 L100,410"/>
<path id="N2" d="M700,570 L700,410"/>
<path id="GN" d="M30,42 L10,42 L10,390 L70,390"/>
</defs>
<g id="bg"></g><g id="fl"></g><g id="pk"></g>
<g transform="translate(40,1010)"><circle r="5" fill="var(--req)"/><text x="12" y="4">Request (steps 1-7)</text>
<circle cx="170" r="5" fill="var(--res)"/><text x="182" y="4">Response, same servers back</text>
<circle cx="390" r="5" fill="var(--nat)"/><text x="402" y="4">Private subnet via NAT</text></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg",bg=document.getElementById("bg"),fl=document.getElementById("fl"),pk=document.getElementById("pk");
function E(t,a,p,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x)e.textContent=x;(p||bg).appendChild(e);return e}
function zone(x,y,w,h,l,lx,ly,anc,col){E("rect",{x,y,width:w,height:h,rx:10,class:"z",style:col?"stroke:"+col:""});if(l)E("text",{x:lx,y:ly,class:"m","text-anchor":anc||"start"},bg,l)}
function ic(g,t){const P=d=>E("path",{d},g),C=(cx,cy,r)=>E("circle",{cx,cy,r},g);
 if(t.startsWith("Git")){P("M12 3L21 12L12 21L3 12Z");P("M10 8v8M10 12h4");C(10,8,1.4);C(10,16,1.4);C(14,12,1.4)}
 else if(t=="Users"||t=="IAM role"){C(12,8,3.5);P("M5 20c0-4 3-6 7-6s7 2 7 6z")}
 else if(t=="Terraform"){P("M4 5l6 3.5v6.5L4 11.5zM11 8.5l6 3.5v6.5l-6-3.5zM11 1.5l6 3.5v3.5l-6-3.5z")}
 else if(t.startsWith("Internet")){C(12,12,8);E("ellipse",{cx:12,cy:12,rx:3.5,ry:8},g);P("M4 12h16")}
 else if(t.includes("ALB")){C(12,5,2);C(5,19,2);C(12,19,2);C(19,19,2);P("M12 7v4M12 11L5 17M12 11v6M12 11l7 6")}
 else if(t.startsWith("EC2")){E("rect",{x:7,y:7,width:10,height:10,rx:1},g);P("M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3")}
 else if(t.startsWith("NAT")){P("M5 8h6M5 8v11h11v-6M13 11l7-7M14 4h6v6")}
 else if(t.startsWith("RDS")){E("ellipse",{cx:12,cy:6,rx:7,ry:2.5},g);P("M5 6v12c0 1.4 3 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3 2.5 7 2.5s7-1.1 7-2.5")}
 else if(t=="CloudWatch"){C(10,10,6);P("M14.5 14.5L20 20M7 11l2-2 2 2 2-3")}
 else if(t=="Systems Manager"){P("M4 7h16M4 12h16M4 17h16");C(9,7,2);C(15,12,2);C(8,17,2)}
 else if(t=="S3 bucket"){E("ellipse",{cx:12,cy:6,rx:7,ry:2.5},g);P("M5 6l2 13c0 1 2.3 2 5 2s5-1 5-2l2-13")}}
function box(x,y,w,h,t,s,c,dash){E("rect",{x,y,width:w,height:h,rx:8,class:"b",style:dash?"stroke-dasharray:4 3":""});
 if(c){E("rect",{x:x+8,y:y+h/2-13,width:26,height:26,rx:5,fill:c});const g=E("g",{transform:"translate("+(x+9)+","+(y+h/2-12)+") scale(.96)",fill:"none",stroke:"#fff","stroke-width":1.7,"stroke-linecap":"round","stroke-linejoin":"round"});ic(g,t)}
 const tx=c?x+40:x+w/2,an=c?"start":"middle";
 E("text",{x:tx,y:s?y+h/2-2:y+h/2+4,"text-anchor":an,style:"font-weight:600"},bg,t);
 if(s)E("text",{x:tx,y:y+h/2+12,class:"m","text-anchor":an},bg,s)}
function pill(cx,cy,w,t){E("rect",{x:cx-w/2,y:cy-8,width:w,height:16,rx:8,class:"sg"});E("text",{x:cx,y:cy+3,"text-anchor":"middle",style:"font-size:9px"},bg,t)}
// containers
E("rect",{x:20,y:90,width:760,height:830,rx:14,class:"b",style:"fill:none"});
E("text",{x:36,y:112,style:"font-weight:600"},bg,"VPC, ap-south-1");E("text",{x:764,y:112,class:"m","text-anchor":"end"},bg,"10.0.0.0/16");
box(30,20,180,44,"Git Repository","Remote","#e8590c");
box(300,20,200,44,"Users","Browser, HTTP :80","#222");

box(300,125,200,40,"Internet gateway","Public route table","#7c3aed");
zone(40,175,360,715,"AZ ap-south-1a",52,192);zone(410,175,360,715,"AZ ap-south-1b",422,192);
box(200,200,400,50,"External ALB","internet-facing, both public subnets, /health","#7c3aed");pill(400,200,200,"SG alb-ext: in :80 from 0.0.0.0/0");
zone(50,275,340,160,"public-1a, 10.0.1.0/24",380,428,"end","#2563eb");zone(420,275,340,160,"public-1b, 10.0.2.0/24",750,428,"end","#2563eb");
zone(60,285,680,75,null,0,0,0,"#16a34a");pill(400,285,190,"Auto Scaling group: min 2, max 4");
box(70,300,300,50,"EC2 web server","Nginx proxy, t3.micro","#e8590c");box(440,300,300,50,"EC2 web server","Nginx proxy, t3.micro","#e8590c");pill(665,350,130,"SG web: :80 from ALB");
box(70,370,130,40,"NAT gateway","","#7c3aed");box(600,370,130,40,"NAT gateway","","#7c3aed");
box(200,470,400,50,"Internal ALB","private, both app subnets, :4000","#7c3aed");pill(400,470,200,"SG alb-int: in :80 from web");
zone(50,545,340,150,"private-app-1a, 10.0.3.0/24",380,688,"end","#e8590c");zone(420,545,340,150,"private-app-1b, 10.0.4.0/24",750,688,"end","#e8590c");
zone(60,555,680,75,null,0,0,0,"#16a34a");pill(400,555,190,"Auto Scaling group: min 2, max 4");
box(70,570,300,50,"EC2 app server","Node.js :4000, t3.micro","#e8590c");box(440,570,300,50,"EC2 app server","Node.js :4000, t3.micro","#e8590c");pill(665,620,140,"SG app: :4000 from alb-int");
zone(50,720,340,150,"private-db-1a, 10.0.5.0/24",380,862,"end","#c026d3");zone(420,720,340,150,"private-db-1b, 10.0.6.0/24",750,862,"end","#c026d3");
box(70,750,300,60,"RDS for MySQL","db.t3.micro, encrypted, single-AZ","#c026d3");pill(140,810,130,"SG db: :3306 from app");
box(440,750,300,60,"No instance","DB subnet group only","",true);
E("text",{x:440,y:703,class:"m"},bg,"MySQL :3306");
[["IAM role","Instance profile"],["CloudWatch","3 log groups, 7d"],["Systems Manager","Session access"],["S3 bucket",""],["Terraform","IaC provisioning"]].forEach((d,i)=>box(20+i*155,940,140,44,d[0],d[1],["#dc2626","#db2777","#db2777","#16a34a","#7c3aed"][i]));
// flows
[["A","q"],["B","q"],["N1","n"],["N2","n"],["GN","q"]].forEach(p=>E("use",{href:"#"+p[0],class:"flow "+p[1]},fl));
E("text",{x:40,y:84,class:"m"},fl,"git fetch: app code");
function pkt(id,col,n,dur,dx){for(let i=0;i<n;i++){const g=E("g",{},pk),h=E("g",{transform:"translate("+dx+",0)"},g);
 E("circle",{r:8,fill:col,opacity:.25},h);E("circle",{r:4.5,fill:col},h);
 const m=E("animateMotion",{dur:dur+"s",repeatCount:"indefinite",begin:"-"+(i*dur/n)+"s"},g);E("mpath",{href:"#"+id},m)}}
pkt("A","var(--req)",3,6,0);pkt("B","var(--req)",3,7,0);
pkt("RA","var(--res)",3,6,14);pkt("RB","var(--res)",3,7,14);
pkt("N1","var(--nat)",2,3,0);pkt("N2","var(--nat)",2,3,0);pkt("GN","var(--req)",3,5,0);
let paused=false;const s=document.getElementById("s"),b=document.getElementById("t");
b.onclick=()=>{paused=!paused;paused?s.pauseAnimations():s.unpauseAnimations();document.querySelectorAll(".flow").forEach(e=>e.style.animationPlayState=paused?"paused":"running");b.textContent=paused?"Play":"Pause"};
</script></body></html>
